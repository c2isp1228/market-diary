<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日复盘 · 开盘收盘记录</title>
  <meta name="description" content="每天的开盘/收盘照片记录与当日新闻分析">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1>每日复盘</h1>
        <p class="subtitle">开盘 / 收盘记录 · 当日新闻分析</p>
      </div>
      <div class="stat" id="statLine">加载中…</div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="review">每日复盘</button>
      <button class="tab" data-view="archive">分析记录</button>
      <button class="tab" data-view="gallery">照片库</button>
      <button class="tab" data-view="about">使用说明</button>
    </nav>
  </header>

  <main id="main" class="main"></main>

  <footer class="site-footer">
    <p>照片与数据由 Claude 每日整理 · 最后更新 <span id="updatedAt">—</span></p>
  </footer>

  <!-- 图片灯箱 -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="关闭">×</button>
    <button class="lb-prev" id="lbPrev" aria-label="上一张">‹</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="">
      <figcaption class="lb-caption" id="lbCaption"></figcaption>
    </figure>
    <button class="lb-next" id="lbNext" aria-label="下一张">›</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
